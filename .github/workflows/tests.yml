# Builds Hearts_2 and runs AllTests on every push to the integration branch or a
# cloud branch, and on pull requests (2026-11-05, project review item 7).
# Same commands as HANDOFF_cloud.md section 2. Measurement runs stay manual.
name: tests

on:
  push:
    branches: [AI_Player_dev, main, "cloud/**"]
  pull_request:
  workflow_dispatch:

jobs:
  all-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: javac -nowarn -d out -cp forms-1.3.0.jar $(find src test tools/measure -name "*.java")
      - name: AllTests
        run: java -cp "out:forms-1.3.0.jar" hearts_1.AllTests > alltests.log 2>&1; status=$?; tail -60 alltests.log; exit $status
      - name: Keep the full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alltests-log
          path: alltests.log
